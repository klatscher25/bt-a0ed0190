<title>Bewerbungs-Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#111833;
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Noto Sans",Arial,sans-serif;
background:radial-gradient(900px 500px at 110% -10%,rgba(236,72,153,.55),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(14,165,233,.5),transparent 60%),linear-gradient(135deg,#312e81,#4f46e5 50%,#7c3aed)}
.card{width:min(100%,380px);background:rgba(255,255,255,.97);border-radius:26px;padding:30px 24px 24px;box-shadow:0 20px 60px rgba(17,24,51,.35);text-align:center}
.lock{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 10px 24px rgba(99,102,241,.4)}
.lock svg{width:30px;height:30px}
h1{font-size:1.35rem;margin:0 0 4px;letter-spacing:-.3px}
p{margin:0 0 20px;color:#6b7394;font-size:.95rem}
.field{position:relative}
input[type=password],input[type=text]{width:100%;height:54px;padding:0 52px 0 16px;font-size:1.05rem;border:2px solid #e6e8f2;border-radius:16px;background:#f6f7fc;outline:none;transition:border-color .15s,background .15s;color:#111833}
input:focus{border-color:#6366f1;background:#fff}
.eye{position:absolute;right:6px;top:6px;width:42px;height:42px;border:0;background:transparent;border-radius:12px;color:#6b7394;cursor:pointer;display:grid;place-items:center}
.eye svg{width:22px;height:22px}
.rem{display:flex;align-items:center;gap:10px;margin:16px 2px 0;font-size:.95rem;color:#3d4566;cursor:pointer;text-align:left;user-select:none}
.rem input{width:22px;height:22px;accent-color:#6366f1;margin:0}
button.go{margin-top:20px;width:100%;height:54px;font-size:1.05rem;font-weight:700;border:0;border-radius:16px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 10px 24px rgba(79,70,229,.35)}
button.go:disabled{opacity:.7}
#err{color:#be123c;font-size:.9rem;min-height:1.4em;margin-top:12px;font-weight:600}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.small{margin-top:6px;font-size:.8rem;color:#8d95b5}
</style></head>

async function master(pw){const b=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode('trk-master-v2'),iterations:P.n,hash:'SHA-256'},b,256);
return crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveKey']);}
async function open_(mk){const k=await crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:d(P.s),info:te.encode('page')},mk,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},k,d(P.c)));}
const KS={db(){return new Promise((res,rej)=>{const r=indexedDB.open('trk',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
op(mode,f){return this.db().then(db=>new Promise((res,rej)=>{const t=db.transaction('k',mode);const q=f(t.objectStore('k'));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)}))},
get(){return this.op('readonly',s=>s.get('mk')).catch(()=>null)},put(k){return this.op('readwrite',s=>s.put(k,'mk')).catch(()=>{})},del(){return this.op('readwrite',s=>s.delete('mk')).catch(()=>{})}};
function show(h,mk,pw){window.__trkMK=mk;if(pw)window.__trkPW=pw;document.open();document.write(h);document.close();}
async function go(pw,remember){$('go').disabled=true;$('go').textContent='Wird geöffnet …';

catch(e){$('go').disabled=false;$('go').textContent='Öffnen';$('err').textContent='Das Passwort stimmt leider nicht.';const f=$('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('pw').select();}}
